      --gray-bg: #F5F5F5;
      --text: #1A237E;
      --text-main: #212121;
      --bg: #F0FDFF;
      --card: #FFFFFF;
      --border: #B3E5FC;
      --shadow: 0 2px 12px rgba(2,136,209,0.10);

    html, body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif; background:var(--bg); color:var(--text-main); overflow-x:hidden; }

    .header {
      background: var(--blue-dark); color: white; padding: 10px 14px;
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-icon { font-size: 22px; }
    .header-text { flex: 1; }
    .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .header-title span { color: #80DEEA; }
    .header-sub { font-size: 10px; opacity: 0.8; margin-top: 1px; }
    .header-area { background: rgba(255,255,255,0.18); padding: 4px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }

    .season-banner { background: linear-gradient(90deg, #0288D1, #00ACC1); color: white; padding: 7px 14px; font-size: 12px; text-align: center; }

    .filter-wrap { background: white; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 6px 12px; border-radius: 20px;
      border: 1.5px solid var(--blue-mid); background: white;
      color: var(--blue-dark); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.12s; user-select: none;
    }
    .filter-chip.active { background: var(--blue-mid); color: white; border-color: var(--blue-mid); }
    .filter-chip:active { opacity: 0.7; }

    #map { height: 40vh; min-height: 210px; max-height: 300px; width: 100%; }

    .spot-header { padding: 10px 14px 4px; display: flex; align-items: baseline; gap: 6px; }
    .spot-count { font-size: 22px; font-weight: 800; color: var(--blue-dark); }
    .spot-label { font-size: 12px; color: var(--gray); }

    .cards { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; cursor: pointer; border: 1.5px solid transparent; transition: border-color 0.15s, transform 0.1s; }
    .card:active { transform: scale(0.985); }
    .card.highlighted { border-color: var(--blue-mid); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .card-name { font-size: 15px; font-weight: 700; color: var(--text-main); flex: 1; line-height: 1.35; }
    .card-type-badge { font-size: 10px; background: var(--blue-light); color: var(--blue-dark); padding: 3px 7px; border-radius: 8px; margin-left: 8px; white-space: nowrap; font-weight: 600; flex-shrink: 0; }
    .card-meta { font-size: 11px; color: var(--gray); display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 9px; }
    .card-meta-item { display: flex; align-items: center; gap: 2px; }
    .card-icons { display: flex; gap: 14px; flex-wrap: wrap; }
    .ci { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .ci-emoji { font-size: 18px; line-height: 1; }
    .ci-label { font-size: 9px; font-weight: 600; }
    .ci.ok .ci-label { color: var(--green); }
    .ci.ng .ci-label { color: var(--red); }
    .ci.warn .ci-label { color: var(--orange); }
    .ci.unknown .ci-label { color: #BDBDBD; }

    .no-results { text-align: center; padding: 50px 20px; color: var(--gray); }
    .no-results-emoji { font-size: 52px; margin-bottom: 12px; }
    .no-results-text { font-size: 14px; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 3000; align-items: flex-end; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 22px 22px 0 0; width: 100%; max-height: 88vh; overflow-y: auto; overflow-x: hidden; animation: slideUp 0.22s cubic-bezier(.4,0,.2,1); padding-bottom: env(safe-area-inset-bottom, 20px); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: #E0E0E0; border-radius: 2px; margin: 12px auto 0; }
    .modal-close-row { display: flex; justify-content: flex-end; padding: 6px 14px 0; }
    .modal-close { width: 30px; height: 30px; background: var(--gray-bg); border: none; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--gray); }

    .modal-photo { width: 100%; height: 180px; background: linear-gradient(135deg, #B3E5FC, #E0F7FA); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 64px; }
    .modal-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .modal-body { padding: 0 16px; }
    .modal-name { font-size: 20px; font-weight: 800; color: var(--text-main); margin: 12px 0 3px; line-height: 1.3; }
    .modal-address { font-size: 12px; color: var(--gray); margin-bottom: 8px; }

    .official-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--green); background: var(--green-bg); padding: 3px 7px; border-radius: 6px; font-weight: 600; margin-bottom: 10px; }

    .modal-period-box { background: var(--blue-light); border-radius: 10px; padding: 10px 12px; margin: 10px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .period-item { }
    .period-label { font-size: 10px; color: var(--blue-dark); font-weight: 600; }
    .period-value { font-size: 13px; font-weight: 700; color: var(--text-main); margin-top: 2px; }

    .cleaning-box { background: #FFF8E1; border-radius: 10px; padding: 9px 12px; margin: 8px 0; font-size: 11px; color: #5D4037; line-height: 1.6; border-left: 3px solid #FFA726; }
    .cleaning-title { font-weight: 700; font-size: 11px; margin-bottom: 3px; color: #E65100; }

    .section-title { font-size: 11px; font-weight: 700; color: var(--gray); letter-spacing: 0.8px; text-transform: uppercase; margin: 14px 0 8px; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 4px; }
    .info-cell { background: var(--gray-bg); border-radius: 10px; padding: 9px 10px; }
    .info-cell-top { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
    .info-cell-icon { font-size: 16px; }
    .info-cell-label { font-size: 10px; color: var(--gray); font-weight: 600; }
    .info-cell-value { font-size: 13px; font-weight: 700; }
    .info-cell-value.ok { color: var(--green); }
    .info-cell-value.ng { color: var(--red); }
    .info-cell-value.warn { color: var(--orange); }
    .info-cell-value.unknown { color: #BDBDBD; }

    .note-box { background: #F8FFFE; border-left: 3px solid var(--blue); border-radius: 0 8px 8px 0; padding: 9px 11px; font-size: 13px; color: var(--text-main); line-height: 1.55; margin: 10px 0; }

// ─── FILTERS ─────────────────────────────────────────────────────────────────
const FILTER_DEFS = [
  { id: 'fountain',  label: '⛲ 噴水あり',       test: s => s.type.includes('噴水') },
  { id: 'flow',      label: '🌊 流れ・滝',       test: s => s.type.includes('流れ') || s.type.includes('滝') || s.type.includes('せせらぎ') },
  { id: 'large',     label: '📏 広め(100㎡↑)',   test: s => { const m = parseInt(s.scale); return m >= 100; } },
  { id: 'fewclean',  label: '🧹 清掃少ない',     test: s => s.cleaningDays && s.cleaningDays.includes('清掃なし') },
  { id: 'parking',   label: '🚗 駐車場あり',     test: s => s.parking === true },
  { id: 'toilet',    label: '🚻 トイレあり',     test: s => s.toilet === true },
  { id: 'station',   label: '🚃 駅近',           test: s => s.nearStation === true },
];

const activeFilters = new Set();
let map, markers = {};
let selectedId = null;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function boolLabel(val, okText = 'あり', ngText = 'なし', unknownText = '要確認') {
  if (val === true)  return { text: okText,      cls: 'ok' };
  if (val === false) return { text: ngText,       cls: 'ng' };
  return               { text: unknownText, cls: 'unknown' };
}

function filteredSpots() {
  if (activeFilters.size === 0) return SPOTS;
  return SPOTS.filter(s => [...activeFilters].every(fid => {
    const f = FILTER_DEFS.find(f => f.id === fid);
    return f ? f.test(s) : true;
  }));
}

// ─── MAP ─────────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true, attributionControl: false }).setView([35.682, 139.873], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  L.control.attribution({ position: 'bottomright', prefix: '' })
    .addAttribution('© <a href="https://osm.org/copyright" style="font-size:9px">OpenStreetMap</a>')
    .addTo(map);
  SPOTS.forEach(s => addMarker(s));
}

function addMarker(spot) {
  const m = L.marker([spot.lat, spot.lng], { icon: makeIcon(spot, false) }).addTo(map);
  m.on('click', () => openModal(spot.id));
  markers[spot.id] = m;
}

function makeIcon(spot, active) {
  return L.divIcon({
    html: `<div style="background:${active ? '#0277BD' : '#29B6F6'};color:white;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,0.28);border:2.5px solid white;">${spot.emoji}</div>`,
    iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -20], className: ''
  });
}

function refreshMarkers(visibleIds) {
  SPOTS.forEach(s => {
    const m = markers[s.id];
    if (!m) return;
    m.setOpacity(visibleIds.includes(s.id) ? 1 : 0.2);
    m.setIcon(makeIcon(s, s.id === selectedId));
  });
}

// ─── CARDS ───────────────────────────────────────────────────────────────────
function renderCards() {
  const spots = filteredSpots();
  document.getElementById('spotCount').textContent = spots.length;
  const list = document.getElementById('cardList');

  if (spots.length === 0) {
    list.innerHTML = `<div class="no-results"><div class="no-results-emoji">🔍</div><div class="no-results-text">条件に合うスポットが見つかりませんでした</div></div>`;
    refreshMarkers([]);
    return;
  }

  list.innerHTML = spots.map(s => cardHTML(s)).join('');
  spots.forEach(s => {
    document.getElementById(`card-${s.id}`).addEventListener('click', () => openModal(s.id));
  });
  refreshMarkers(spots.map(s => s.id));
}

function cardHTML(s) {
  const infoItems = [
    { emoji: '🚻', label: 'トイレ',   val: s.toilet,      ok: 'あり', ng: 'なし' },
    { emoji: '🚗', label: '駐車場',   val: s.parking,     ok: 'あり', ng: 'なし' },
    { emoji: '🌳', label: '日陰',     val: s.shade,       ok: 'あり', ng: '少ない' },
    { emoji: '🚃', label: '駅近',     val: s.nearStation, ok: '近い',  ng: '車推奨' },
  ];
  const iconsHTML = infoItems.map(item => {
    const r = boolLabel(item.val, item.ok, item.ng);
    return `<div class="ci ${r.cls}"><span class="ci-emoji">${item.emoji}</span><span class="ci-label">${r.text}</span></div>`;
  }).join('');

  return `
    <div class="card${selectedId === s.id ? ' highlighted' : ''}" id="card-${s.id}">
      <div class="card-top">
        <div class="card-name">${s.name.replace('\n', ' ')}</div>
        <div class="card-type-badge">${s.type}</div>
      </div>
      <div class="card-meta">
        <span class="card-meta-item">📐 ${s.scale}</span>
        <span class="card-meta-item">📅 ${s.period}</span>
      </div>
      <div class="card-icons">${iconsHTML}</div>
    </div>`;
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function openModal(id) {
  const s = SPOTS.find(s => s.id === id);
  if (!s) return;
  selectedId = id;
  map.panTo([s.lat, s.lng], { animate: true });
  refreshMarkers(filteredSpots().map(s => s.id));
  document.querySelectorAll('.card').forEach(el => el.classList.remove('highlighted'));
  const card = document.getElementById(`card-${id}`);
  if (card) { card.classList.add('highlighted'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  document.getElementById('modalContent').innerHTML = modalHTML(s);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  selectedId = null;
  document.querySelectorAll('.card').forEach(el => el.classList.remove('highlighted'));
  refreshMarkers(filteredSpots().map(s => s.id));
}

function modalHTML(s) {
  const infoRows = [
    { emoji: '🍼', label: 'おむつ持込',         val: s.diaper,   ok: 'OK',    ng: 'NG（公式ルール）' },
    { emoji: '🚻', label: 'トイレ',             val: s.toilet,   ok: 'あり',  ng: 'なし' },
    { emoji: '👗', label: '更衣室',             val: s.changing, ok: 'あり',  ng: 'なし（公式ルール）' },
    { emoji: '🌳', label: '日陰',               val: s.shade,    ok: 'あり',  ng: '少ない' },
    { emoji: '🚗', label: '駐車場',             val: s.parking,  ok: 'あり',  ng: 'なし' },
    { emoji: '🚃', label: '駅近（徒歩圏）',     val: s.nearStation, ok: '近い', ng: '車推奨' },
  ];
  const gridHTML = infoRows.map(r => {
    const result = boolLabel(r.val, r.ok, r.ng);
    return `<div class="info-cell"><div class="info-cell-top"><span class="info-cell-icon">${r.emoji}</span><span class="info-cell-label">${r.label}</span></div><div class="info-cell-value ${result.cls}">${result.text}</div></div>`;
  }).join('');

  const photoHTML = s.photo
    ? `<div class="modal-photo"><img src="${s.photo}" alt="${s.shortName}" loading="lazy"></div>`
    : `<div class="modal-photo">${s.emoji}</div>`;

  return `
    ${photoHTML}
    <div class="modal-body">
      <div class="modal-name">${s.name.replace('\n', '<br>')}</div>
      <div class="modal-address">📍 ${s.address}</div>
      <div class="official-badge">✅ 江戸川区公式情報（${s.lastChecked || '2026-01-15'}）</div>

      <div class="modal-period-box">
        <div class="period-item">
          <div class="period-label">📅 開設期間</div>
          <div class="period-value">${s.period}</div>
        </div>
        <div class="period-item">
          <div class="period-label">📐 規模</div>
          <div class="period-value">${s.scale}</div>
        </div>
        <div class="period-item" style="grid-column:1/-1">
          <div class="period-label">💧 水の特徴</div>
          <div class="period-value">${s.depth}</div>
        </div>
      </div>

      <div class="cleaning-box">
        <div class="cleaning-title">🧹 清掃日（清掃日は利用不可）</div>
        ${s.cleaningDays}
      </div>

      <div class="section-title">施設情報</div>
      <div class="info-grid">${gridHTML}</div>

      <div class="section-title" style="margin-top:14px">年齢感・混雑</div>
      <div class="info-grid">
        <div class="info-cell" style="grid-column:1/-1">
          <div class="info-cell-top"><span class="info-cell-icon">👦</span><span class="info-cell-label">対象年齢感</span></div>
          <div class="info-cell-value warn">${s.ageRange}</div>
        </div>
        <div class="info-cell" style="grid-column:1/-1">
          <div class="info-cell-top"><span class="info-cell-icon">👥</span><span class="info-cell-label">混雑傾向</span></div>
          <div class="info-cell-value unknown">${s.crowd}</div>
        </div>
      </div>

      ${s.note ? `<div class="note-box">${s.note}</div>` : ''}

      <div class="btn-row">
        <a class="btn btn-primary" href="https://maps.google.com/maps?q=${encodeURIComponent(s.gmapQuery)}" target="_blank" rel="noopener">📸 写真・場所を見る</a>
        <a class="btn btn-directions" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.gmapQuery)}" target="_blank" rel="noopener">🗺️ 道順</a>
      </div>
      <div class="btn-row" style="margin-top:0">
        <a class="btn btn-secondary" href="${OFFICIAL}" target="_blank" rel="noopener">🔗 江戸川区公式サイトで確認</a>
      </div>

      <div class="disclaimer">
        ⚠️ <strong>利用前に必ず公式サイトで最新情報を確認してください。</strong><br>
        清掃日・開設期間は工事・天候等により変更になる場合があります。<br>
        おむつの取れていないお子様のご利用はご遠慮ください（全公園共通）。更衣室はありません。
      </div>
    </div>`;
}

// ─── FILTER UI ───────────────────────────────────────────────────────────────
function renderFilters() {
  const row = document.getElementById('filterRow');
  row.innerHTML = FILTER_DEFS.map(f => `
    <button class="filter-chip${activeFilters.has(f.id) ? ' active' : ''}"
            id="fc-${f.id}"
            onclick="toggleFilter('${f.id}')">${f.label}</button>
  `).join('');
}

function toggleFilter(id) {
  if (activeFilters.has(id)) activeFilters.delete(id);
  else activeFilters.add(id);
  renderFilters();
  renderCards();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderFilters();
  initMap();
  renderCards();
});
</script>
</body>
</html>
